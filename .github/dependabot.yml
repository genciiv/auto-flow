version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Tirane"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"

    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"

      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"

      react:
        patterns:
          - "react"
          - "react-dom"

      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

      development-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Tirane"
    open-pull-requests-limit: 3

    commit-message:
      prefix: "chore(actions)"
