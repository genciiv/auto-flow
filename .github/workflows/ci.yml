name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Security and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: autoflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      APP_ENV: ci

      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_GOOGLE_ID: ci-google-client-id
      AUTH_GOOGLE_SECRET: ci-google-client-secret-ci-google-client-secret
      CRON_SECRET: ci-cron-secret-ci-cron-secret-ci-cron-secret

      NEXT_PUBLIC_APP_URL: http://localhost:3000

      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/autoflow?schema=public
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/autoflow?schema=public

      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-ci-service-role-key
      SUPABASE_STORAGE_BUCKET: ci-bucket

      BREVO_API_KEY: xkeysib-ci-only-key
      EMAIL_FROM: "AutoFlow CI <ci@autoflow.test>"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile integrity
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run dependency security audit
        run: npm run audit:dependencies

      - name: Run project audit gates
        run: npm run audit:ci

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare browser E2E credentials
        shell: bash
        run: |
          OWNER_PASSWORD="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('hex'))")"
          ADMIN_PASSWORD="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('hex'))")"

          echo "ALLOW_DATABASE_SEED=true" >> "$GITHUB_ENV"
          echo "SEED_OWNER_PASSWORD=$OWNER_PASSWORD" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_OWNER_EMAIL=owner@autoflow.al" >> "$GITHUB_ENV"
          echo "E2E_OWNER_PASSWORD=$OWNER_PASSWORD" >> "$GITHUB_ENV"

      - name: Seed browser E2E database
        run: npx prisma db seed

      - name: Run browser E2E tests
        run: npm run test:browser
