name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: ci
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autoflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/autoflow?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run audit:ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
